[package]
name = "arr"
version = "0.1.0"
authors = ["Takahiro Sanada"]
edition = "2021"
build = "build.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
lalrpop = "0.20.0"

[dependencies]
rand="0.8.5"
rand_distr="0.4.3"
lalrpop-util = { version = "0.20.0", features = ["lexer"] }
regex = { version="1.3", features = ["unicode-perl"] }
